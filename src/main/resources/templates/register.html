<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - Mu 的小基地</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* 栅格布局：12 列网格系统 */
        .grid-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            width: 46%;
            min-width: 340px;
            max-width: 520px;
        }
        .col-12 { grid-column: span 12; }
        .col-6  { grid-column: span 6; }
        .col-3  { grid-column: span 3; }
        .col-9  { grid-column: span 9; }

        .register-card { grid-column: span 12; }
        .register-title { text-align: center; margin-bottom: 20px; color: #333; }
        .register-title .sprite { vertical-align: middle; margin-right: 8px; }

        .form-row { display: flex; gap: 10px; align-items: center; }
        .form-row .sprite { flex-shrink: 0; }
        .form-row input { flex: 1; }

        .pwd-rules {
            font-size: 12px; color: #999; margin-top: 6px; line-height: 1.6;
        }
        .pwd-strength {
            height: 6px; border-radius: 3px; background: #eee; margin-top: 8px; overflow: hidden;
        }
        .pwd-strength-bar {
            height: 100%; width: 0; transition: all .3s;
            background: linear-gradient(90deg, #f56c6c, #e6a23c, #67c23a);
        }
        .btn-full { width: 100%; }
        .register-foot { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
        .register-foot a { color: #667eea; margin-left: 6px; }
        @media (max-width: 600px) { .grid-row { width: 94%; } }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    <div class="grid-container">
        <div class="grid-row form-card register-card">
            <h2 class="register-title col-12"><span class="sprite sprite-user"></span>用户注册</h2>

            <div class="col-12">
                <div id="alert" class="alert"></div>
            </div>

            <form id="registerForm" class="col-12" onsubmit="return doRegister(event)">
                <div class="form-item">
                    <label>用户名</label>
                    <div class="form-row">
                        <span class="sprite sprite-sm sprite-user"></span>
                        <input type="text" id="username" placeholder="3-20位字母/数字/下划线" autocomplete="off" required>
                    </div>
                </div>

                <div class="form-item">
                    <label>密码</label>
                    <div class="form-row">
                        <span class="sprite sprite-sm sprite-lock"></span>
                        <input type="password" id="password" placeholder="至少8位，含大小写字母和数字" required>
                    </div>
                    <div class="pwd-strength"><div id="strengthBar" class="pwd-strength-bar"></div></div>
                    <div class="pwd-rules">
                        规则：长度≥8，必须同时包含大写字母、小写字母和数字
                    </div>
                </div>

                <div class="form-item">
                    <label>确认密码</label>
                    <div class="form-row">
                        <span class="sprite sprite-sm sprite-lock"></span>
                        <input type="password" id="confirm" placeholder="请再次输入密码" required>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success btn-full">注 册</button>
                </div>
            </form>

            <div class="register-foot col-12">
                已有账号？<a th:href="@{/auth/login}">返回登录</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        // 密码强度实时检测
        document.getElementById('password').addEventListener('input', function () {
            var v = this.value;
            var score = 0;
            if (v.length >= 8) score += 25;
            if (/[A-Z]/.test(v)) score += 25;
            if (/[a-z]/.test(v)) score += 25;
            if (/[0-9]/.test(v)) score += 25;
            document.getElementById('strengthBar').style.width = score + '%';
        });

        function doRegister(e) {
            e.preventDefault();
            hideAlert('alert');
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var confirm  = document.getElementById('confirm').value;

            if (!username || !password || !confirm) {
                showAlert('alert', 'error', '请填写完整信息'); return false;
            }
            if (password !== confirm) {
                showAlert('alert', 'error', '两次输入的密码不一致'); return false;
            }

            postJSON('/auth/register', { username: username, password: password, confirm: confirm }, function (res) {
                showAlert('alert', 'success', res.message);
                redirectLater(res.redirect || '/auth/login', 1200);
            }, function (res) {
                if (res.code === 2003) {
                    showAlert('alert', 'warn', res.message);
                } else {
                    showAlert('alert', 'error', res.message);
                }
            });
            return false;
        }
    </script>
</body>
</html>
