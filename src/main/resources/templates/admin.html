<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - Mu 的小基地</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        :root {
            --bg: #f6f8fa; --panel: #fff; --border: #d8dee4;
            --text: #1f2328; --dim: #57606a; --accent: #1f6feb; --red: #cf222e; --green: #2da44e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size: 14px; }
        .shell { max-width: 1080px; margin: 0 auto; padding: 24px; }
        .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .topbar h1 { font-size: 20px; }
        .topbar .spacer { flex: 1; }
        .topbar a { color: var(--accent); text-decoration: none; font-size: 13px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 8px 18px; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 13px; }
        .tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { background: #f0f3f6; color: var(--dim); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        .badge.ok { background: rgba(45,164,78,.12); color: var(--green); }
        .badge.fail { background: rgba(207,34,46,.12); color: var(--red); }
        .unban-btn { color: var(--accent); cursor: pointer; border: 1px solid var(--accent); background: transparent; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
        .unban-btn:hover { background: var(--accent); color: #fff; }
        .empty { padding: 40px; text-align: center; color: var(--dim); }
        .loading { padding: 40px; text-align: center; color: var(--dim); }
        .pager { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--dim); font-size: 13px; }
        .pager button { padding: 4px 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
<div class="shell">
    <div class="topbar">
        <h1>管理后台</h1>
        <span class="spacer"></span>
        <span th:text="'管理员：' + ${username}"></span>
        <a th:href="@{/home}">返回首页</a>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="logs" onclick="switchTab('logs')">登录日志</div>
        <div class="tab" data-tab="blacklist" onclick="switchTab('blacklist')">IP 黑名单</div>
    </div>

    <!-- 登录日志 -->
    <div class="panel" id="tab-logs">
        <div class="loading" id="logsLoading">加载中...</div>
        <table id="logsTable" style="display:none;">
            <thead>
                <tr><th>用户名</th><th>IP</th><th>结果</th><th>说明</th><th>时间</th></tr>
            </thead>
            <tbody id="logsBody"></tbody>
        </table>
        <div class="pager">
            <button onclick="prevPage()">上一页</button>
            <span id="pageInfo">第 1 页</span>
            <button onclick="nextPage()">下一页</button>
        </div>
    </div>

    <!-- IP 黑名单 -->
    <div class="panel" id="tab-blacklist" style="display:none;">
        <div class="loading" id="blLoading">加载中...</div>
        <table id="blTable" style="display:none;">
            <thead>
                <tr><th>IP</th><th>拉黑原因</th><th>解封时间</th><th>拉黑时间</th><th>操作</th></tr>
            </thead>
            <tbody id="blBody"></tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script th:inline="none">
    var curPage = 0;

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tab); });
        document.getElementById('tab-logs').style.display = tab === 'logs' ? '' : 'none';
        document.getElementById('tab-blacklist').style.display = tab === 'blacklist' ? '' : 'none';
        if (tab === 'logs') loadLogs(); else loadBlacklist();
    }

    function loadLogs() {
        document.getElementById('logsLoading').style.display = '';
        document.getElementById('logsTable').style.display = 'none';
        fetch('/admin/logs?page=' + curPage + '&size=20')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                document.getElementById('logsLoading').style.display = 'none';
                var arr = d.data || [];
                var body = document.getElementById('logsBody');
                if (!arr.length) {
                    body.innerHTML = '<tr><td colspan="5" class="empty">暂无登录日志</td></tr>';
                } else {
                    body.innerHTML = arr.map(function (l) {
                        return '<tr><td>' + esc(l.username) + '</td><td>' + esc(l.ip) + '</td>' +
                            '<td>' + (l.success === 1 ? '<span class="badge ok">成功</span>' : '<span class="badge fail">失败</span>') + '</td>' +
                            '<td>' + esc(l.message || '') + '</td><td>' + esc(l.time) + '</td></tr>';
                    }).join('');
                }
                document.getElementById('logsTable').style.display = '';
                document.getElementById('pageInfo').textContent = '第 ' + (curPage + 1) + ' 页';
            })
            .catch(function () { document.getElementById('logsLoading').textContent = '加载失败'; });
    }

    function loadBlacklist() {
        document.getElementById('blLoading').style.display = '';
        document.getElementById('blTable').style.display = 'none';
        fetch('/admin/blacklist')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                document.getElementById('blLoading').style.display = 'none';
                var arr = d.data || [];
                var body = document.getElementById('blBody');
                if (!arr.length) {
                    body.innerHTML = '<tr><td colspan="5" class="empty">暂无黑名单记录</td></tr>';
                } else {
                    body.innerHTML = arr.map(function (b) {
                        return '<tr><td>' + esc(b.ip) + '</td><td>' + esc(b.reason || '') + '</td>' +
                            '<td>' + esc(b.expireTime) + '</td><td>' + esc(b.createTime) + '</td>' +
                            '<td><button class="unban-btn" onclick="unban(\'' + esc(b.ip) + '\')">解除</button></td></tr>';
                    }).join('');
                }
                document.getElementById('blTable').style.display = '';
            })
            .catch(function () { document.getElementById('blLoading').textContent = '加载失败'; });
    }

    function unban(ip) {
        if (!confirm('确定解除 ' + ip + ' 的黑名单吗？')) return;
        postJSON('/admin/unban', { ip: ip }, function () { loadBlacklist(); });
    }

    function prevPage() { if (curPage > 0) { curPage--; loadLogs(); } }
    function nextPage() { curPage++; loadLogs(); }

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadLogs();
</script>
</body>
</html>
